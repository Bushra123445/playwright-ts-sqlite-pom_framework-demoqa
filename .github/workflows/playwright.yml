name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Upload Extent-style report (with videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: extent-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Report info
        if: always()
        run: |
          echo "### Test reports" >> $GITHUB_STEP_SUMMARY
          echo "Scroll down to the **Artifacts** section of this run and download:" >> $GITHUB_STEP_SUMMARY
          echo "- **extent-report** (open index.html: DB data, steps, screenshots, video)" >> $GITHUB_STEP_SUMMARY
          echo "- **playwright-report** (HTML report with traces)" >> $GITHUB_STEP_SUMMARY
          
