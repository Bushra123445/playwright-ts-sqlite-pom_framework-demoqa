name: Playwright Tests and Report Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Prepare report site
        if: always()
        run: |
          mkdir -p site
          cp report-site/index.html site/index.html
          cp -r extent-report site/extent-report
          cp -r playwright-report site/playwright-report || true
          ls -R site | head -50

      - name: Upload site for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy Reports to GitHub Pages
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
